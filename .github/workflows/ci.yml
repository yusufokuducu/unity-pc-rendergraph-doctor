name: .NET Tests & Package CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run NUnit Test Suite (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DotNetTests~/PcRenderGraphDoctor.Tests.csproj

      - name: Build & Run NUnit Tests
        run: dotnet test DotNetTests~/PcRenderGraphDoctor.Tests.csproj --configuration Release --no-restore --verbosity normal
